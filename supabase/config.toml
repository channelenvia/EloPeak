# Supabase local dev config
# Docs: https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
# Max file size in bytes — 10 MB
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false   # desabilita em dev pra facilitar testes

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true

# Mercado Pago calls this webhook directly (x-signature/x-request-id, not a
# Supabase JWT) — the function verifies MP's HMAC signature itself. Without
# verify_jwt = false the platform gateway rejects every MP notification with
# 401 before it ever reaches our code, so payments would never auto-confirm.
[functions.mercadopago-webhook]
verify_jwt = false

# Invoked by a Supabase Database Webhook and by discord-init-channels'
# bootstrap flow respectively — neither call carries a Supabase JWT, both are
# gated by their own x-webhook-secret header check instead.
[functions.discord-order-channel]
verify_jwt = false

[functions.discord-init-channels]
verify_jwt = false

# Mesmo caso de discord-order-channel acima: acionada só pelo trigger
# notify_discord_chat_mention (pg_net), nunca por um usuário logado.
[functions.discord-chat-mention]
verify_jwt = false

# Mesmo caso acima: acionada só pelo trigger notify_discord_review (pg_net,
# migration 20260824070000), nunca por um usuário logado.
[functions.discord-review-announcement]
verify_jwt = false

# Endpoint público e somente leitura. As demais funções chamadas pelo navegador
# mantêm a verificação JWT padrão do gateway em produção. Para desenvolvimento
# com uma sessão do projeto remoto, use o script functions:serve, que passa
# --no-verify-jwt e deixa a validação explícita de cada função ativa.
[functions.riot-profile-icons]
verify_jwt = false
